# Fetches the Higgsfield-generated HD assets and commits them to the branch.
# The Claude cloud sandbox that develops this repo cannot reach Higgsfield's CDN,
# so the download + processing runs here instead (and can be re-run any time).
#
#   mode=preview  -> docs/hd/*.png  downscaled previews of every candidate
#   mode=build    -> src/renderer/assets/hd/  final background + Luna sprite sheet
name: HD assets
on:
  workflow_dispatch:
    inputs:
      mode:
        description: preview or build
        default: preview
        type: choice
        options: [preview, build]
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: node scripts/hd-assets.js ${{ inputs.mode }}
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs/hd src/renderer/assets/hd
          git add -A docs/hd src/renderer/assets/hd
          git diff --cached --quiet || git commit -m "HD assets: ${{ inputs.mode }} (Higgsfield)"
          git push
